# Sito + proxy prenotazioni in un unico Worker:
# le pagine statiche (out/) sono servite come assets, le richieste /api/*
# vengono inoltrate al backend WebAgency_BookingSystem su Railway
# (vedi worker/index.ts).
#
# Dopo il primo deploy imposta la chiave API del tenant:
#   npx wrangler secret put BOOKING_API_KEY
# (oppure da dashboard: Workers → Settings → Variables and Secrets).
# Senza chiave il sito resta in modalità demo.

name = "agenzia-web-claudecode"
main = "worker/index.ts"
compatibility_date = "2024-01-01"

[build]
command = "npm run build"

[assets]
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# Base URL del backend prenotazioni.
BOOKING_API_URL = "https://webagencybookingsystem-production.up.railway.app"

# Storia delle migrazioni Durable Object: la v1 creava lo storage interno
# BookingStore, sostituito dal backend esterno e rimosso nella v2.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BookingStore"]

[[migrations]]
tag = "v2"
deleted_classes = ["BookingStore"]
